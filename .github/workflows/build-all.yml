name: Build Web Party

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-package:
    name: Validate and package Chrome/Edge
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Test
        run: npm test

      - name: Validate extension
        run: npm run check

      - name: Package extension
        run: npm run package

      - name: Validate archive
        run: unzip -t dist/WebParty-chrome-v*.zip

      - name: Upload Chrome/Edge package
        uses: actions/upload-artifact@v4
        with:
          name: web-party-chrome-edge
          path: dist/WebParty-chrome-v*.zip
          if-no-files-found: error
          retention-days: 14
