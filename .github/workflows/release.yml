name: Release Web Party

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag/version to release, for example v0.1.0'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Release Chrome/Edge package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            TAG="$GITHUB_REF_NAME"
          else
            TAG="${{ inputs.tag }}"
            VERSION="${TAG#v}"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must match vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Test
        run: npm test

      - name: Validate extension
        run: npm run check

      - name: Package versioned extension
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: npm run package

      - name: Validate archive
        run: unzip -t "dist/WebParty-chrome-v${{ steps.version.outputs.version }}.zip"

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Web Party ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: dist/WebParty-chrome-v${{ steps.version.outputs.version }}.zip

      # Newest versions win by semantic version, not by date. Deleting a release removes its page
      # and zip; the git tag stays. An old version re-released by hand is removed right away.
      - name: Keep only the latest releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          KEEP_RELEASES: 3
        shell: bash
        run: |
          set -euo pipefail
          gh release list --limit 1000 --json tagName --jq '.[].tagName' \
            | { grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' || true; } \
            | sort -V -r \
            | tail -n +"$((KEEP_RELEASES + 1))" \
            | while read -r tag; do
                echo "Deleting release $tag"
                gh release delete "$tag" --yes
              done
